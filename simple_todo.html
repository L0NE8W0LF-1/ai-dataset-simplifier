<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .input-group button:active {
            transform: translateY(0);
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        .filter-btn:hover {
            border-color: #667eea;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        .todo-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }
        .todo-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }
        .todo-item.completed {
            opacity: 0.6;
            border-left-color: #10b981;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .todo-text {
            flex: 1;
            font-size: 1rem;
            color: #333;
        }
        .todo-actions {
            display: flex;
            gap: 10px;
        }
        .btn-small {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-delete {
            background: #ff6b6b;
            color: white;
        }
        .btn-delete:hover {
            background: #ee5a52;
        }
        .btn-edit {
            background: #ffa94d;
            color: white;
        }
        .btn-edit:hover {
            background: #ff922b;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 1.1rem;
        }
        .footer {
            background: #f5f5f5;
            padding: 15px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
        .local-storage-info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📝 My To-Do List</h1>
            <p>Keep track of your tasks with local storage</p>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Local Storage Info -->
            <div class="local-storage-info">
                <i class="fas fa-info-circle"></i> Your tasks are saved locally in your browser
            </div>

            <!-- Input Section -->
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn">Add</button>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="activeCount">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>

            <!-- To-Do List -->
            <div class="todo-list" id="todoList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fas fa-lock-open"></i> Your data is stored locally and never sent to any server
        </div>
    </div>

    <script>
        // Application State
        const app = {
            todos: [],
            currentFilter: 'all',
            editingId: null,
            storageKey: 'todoList_app'
        };

        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalCount = document.getElementById('totalCount');
        const activeCount = document.getElementById('activeCount');
        const completedCount = document.getElementById('completedCount');

        // Initialize App
        function init() {
            loadFromStorage();
            attachEventListeners();
            render();
        }

        // Load data from localStorage
        function loadFromStorage() {
            const stored = localStorage.getItem(app.storageKey);
            if (stored) {
                try {
                    app.todos = JSON.parse(stored);
                } catch (e) {
                    console.error('Error loading from storage:', e);
                    app.todos = [];
                }
            }
        }

        // Save data to localStorage
        function saveToStorage() {
            try {
                localStorage.setItem(app.storageKey, JSON.stringify(app.todos));
            } catch (e) {
                console.error('Error saving to storage:', e);
                alert('Failed to save tasks. Local storage might be full.');
            }
        }

        // Attach event listeners
        function attachEventListeners() {
            // Add button
            addBtn.addEventListener('click', addTask);

            // Enter key in input
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });

            // Filter buttons
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    app.currentFilter = btn.dataset.filter;
                    render();
                });
            });
        }

        // Add new task
        function addTask() {
            const text = taskInput.value.trim();
            
            if (!text) {
                alert('Please enter a task!');
                return;
            }

            const task = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            app.todos.push(task);
            saveToStorage();
            taskInput.value = '';
            taskInput.focus();
            render();
        }

        // Toggle task completion
        function toggleTask(id) {
            const task = app.todos.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveToStorage();
                render();
            }
        }

        // Delete task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                app.todos = app.todos.filter(t => t.id !== id);
                saveToStorage();
                render();
            }
        }

        // Edit task
        function editTask(id) {
            const task = app.todos.find(t => t.id === id);
            if (task) {
                const newText = prompt('Edit task:', task.text);
                if (newText && newText.trim()) {
                    task.text = newText.trim();
                    saveToStorage();
                    render();
                }
            }
        }

        // Get filtered tasks
        function getFilteredTodos() {
            switch (app.currentFilter) {
                case 'active':
                    return app.todos.filter(t => !t.completed);
                case 'completed':
                    return app.todos.filter(t => t.completed);
                default:
                    return app.todos;
            }
        }

        // Update statistics
        function updateStats() {
            const total = app.todos.length;
            const completed = app.todos.filter(t => t.completed).length;
            const active = total - completed;

            totalCount.textContent = total;
            activeCount.textContent = active;
            completedCount.textContent = completed;
        }

        // Render UI
        function render() {
            updateStats();
            
            const filtered = getFilteredTodos();
            
            if (filtered.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>${app.currentFilter === 'all' ? 'No tasks yet. Add one to get started!' : `No ${app.currentFilter} tasks`}</p>
                    </div>
                `;
                return;
            }

            todoList.innerHTML = filtered.map(task => `
                <div class="todo-item ${task.completed ? 'completed' : ''}">
                    <input 
                        type="checkbox" 
                        class="todo-checkbox" 
                        ${task.completed ? 'checked' : ''}
                        onchange="toggleTask(${task.id})"
                    >
                    <span class="todo-text">${escapeHtml(task.text)}</span>
                    <div class="todo-actions">
                        <button class="btn-small btn-edit" onclick="editTask(${task.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-small btn-delete" onclick="deleteTask(${task.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
